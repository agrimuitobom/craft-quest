# main に push → ルールのテスト → ビルド → Firebase Hosting に公開
# Pull Request → プレビュー用 URL を発行（本番には影響しない）
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

# Firebase の設定値はリポジトリの .env から読む（公開値）。
# ここで env を設定すると .env より優先されるので、書かないこと。

jobs:
  test-rules:
    name: セキュリティルールのテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  build-deploy:
    name: ビルドして公開
    needs: test-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy (本番 / プレビュー)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: craft-quest-ef2ef
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
